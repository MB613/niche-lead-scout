# Fly.io configuration for NicheLeadScout
app = 'niche-lead-scout'
primary_region = 'sin'  # Singapore (closest to Pakistan)

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
